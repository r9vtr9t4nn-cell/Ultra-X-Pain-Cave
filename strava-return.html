<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting Strava · The Long Game</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#100d14;color:#fff;font:16px system-ui;text-align:center}.card{max-width:420px;padding:28px}p{color:#b9b2c2}</style></head>
<body><main class="card"><h1>Finishing Strava connection…</h1><p id="status">Returning securely to The Long Game.</p></main>
<script>(function(){const params=new URLSearchParams((location.hash||"").replace(/^#/,""));const session=params.get("strava_session");const status=document.getElementById("status");if(!session){status.textContent="No connection token was returned. Go back to The Long Game and try Connect Strava again.";return;}location.replace("./#strava_session="+encodeURIComponent(session)+"&strava_connected=1");})();</script></body></html>
