<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strava connection · The Long Game</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#100d14;color:#fff;font:16px system-ui;text-align:center}
.card{max-width:460px;margin:20px;padding:30px;border:1px solid #62566b;border-radius:22px;background:#28232f}
p{color:#c8bfce;line-height:1.5}
button{border:0;border-radius:999px;padding:14px 24px;background:#ff2680;color:#250c19;font-weight:700;font-size:16px}
#continue{display:none}
</style>
</head>
<body>
<main class="card">
<h1 id="heading">Finishing Strava connection…</h1>
<p id="status">Securely transferring your connection to this browser.</p>
<button id="continue" type="button">Continue to The Long Game</button>
</main>
<script>
(async function(){
 const WORKER="https://the-long-game-strava.r9vtr9t4nn.workers.dev";
 const heading=document.getElementById("heading");
 const status=document.getElementById("status");
 const button=document.getElementById("continue");
 const code=new URLSearchParams(location.search).get("code");
 if(!code){
  heading.textContent="No connection code received";
  status.textContent="The Strava return link did not include a connection code. Please start Connect Strava again from the app.";
  return;
 }
 try{
  const response=await fetch(WORKER+"/api/exchange",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code})});
  const data=await response.json();
  if(!response.ok||!data.session) throw new Error(data.error||"The connection could not be transferred.");
  localStorage.setItem("longgame-strava-session",data.session);
  if(localStorage.getItem("longgame-strava-session")!==data.session) throw new Error("This browser could not save the connection.");
  history.replaceState(null,"",location.pathname);
  heading.textContent="Strava connected";
  status.textContent="Your secure connection has been saved. Continue to The Long Game, then choose Sync now to import your activities.";
  button.style.display="inline-block";
  button.addEventListener("click",()=>location.replace("./"));
 }catch(error){
  heading.textContent="Strava connection not completed";
  status.textContent=error.message+" Please check the Worker has been updated and deployed, then connect again.";
 }
})();
</script>
</body>
</html>
